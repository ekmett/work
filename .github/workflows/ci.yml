name: Build, test and publish docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - name: Install compiler, build and documentation tools
        run: |
          curl --fail --location --retry 3 https://apt.llvm.org/llvm.sh --output "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23
          sudo apt-get install --no-install-recommends -y clang-tools-23 python3-venv
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/python" -m pip install cmake==4.4.3 ninja==1.13.0
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            --output "$RUNNER_TEMP/doxygen.tar.gz"
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/doxygen"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP/doxygen" --strip-components=1
          echo "$RUNNER_TEMP/doxygen/bin" >> "$GITHUB_PATH"
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DWORK_BUILD_DOCS=ON
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
      - name: Build documentation
        run: cmake --build build --target work-docs
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html
          retention-days: 1
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: ekmett/native/.github/actions/setup/windows@385b740751005952434d10e4ee1c1d3fd1f4766b
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
